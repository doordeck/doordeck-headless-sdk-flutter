name: Flutter build on tag and publish
on:
  push:
    tags:
      - 'v*' # This will reference the pub.dev version

permissions:
  contents: read

jobs:
  publish-pub:
    name: Publish on pub.dev
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Extract version from tag
        id: extract
        run: echo "TAG_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Install Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: .fvmrc
          channel: stable

      - name: Install Dart SDK
        uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1

      - name: Set SDK version in pubspec.yaml
        env:
          TAG_VERSION: ${{ steps.extract.outputs.TAG_VERSION }}
        run: |
          sed -i "s/^version: .*/version: ${TAG_VERSION}/" pubspec.yaml

      - name: Get dependencies
        run: flutter pub get

      - name: Publish to pub.dev
        run: dart pub publish --force

